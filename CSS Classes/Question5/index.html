<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS.</p>
    </header>

    <main class="button-container">

        <!-- Primary button -->
        <button class="btn primary">Primary</button>

        <!-- Secondary button -->
        <button class="btn secondary">Secondary</button>

        <!-- Outline button -->
        <button class="btn outline">Outline</button>

        <!-- Disabled button -->
        <button class="btn disabled" disabled>Disabled</button>

    </main>

    <footer>
        <p>Assignment 8 - Styled Buttons</p>
    </footer>

</body>
</html>
