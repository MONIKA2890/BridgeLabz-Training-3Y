<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Move your mouse over the elements.</p>
    </header>

    <main class="tooltip-container">

        <!-- Tooltip 1 -->
        <div class="tooltip-box">
            <span>HTML</span>
            <div class="tooltip">HyperText Markup Language</div>
        </div>

        <!-- Tooltip 2 -->
        <div class="tooltip-box">
            <span>CSS</span>
            <div class="tooltip">Cascading Style Sheets</div>
        </div>

        <!-- Tooltip 3 -->
        <div class="tooltip-box">
            <span>Grid</span>
            <div class="tooltip">CSS Grid Layout</div>
        </div>

        <!-- Tooltip 4 -->
        <div class="tooltip-box">
            <span>Flexbox</span>
            <div class="tooltip">Flexible Box Layout</div>
        </div>

    </main>

    <footer>
        <p>Assignment 8 - CSS Tooltips</p>
    </footer>

</body>
</html>
