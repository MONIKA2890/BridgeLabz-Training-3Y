<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Formatting</title>
</head>
<body>

    <p>
        I am a <strong>Computer Science student</strong> who enjoys
        <em>learning new technologies</em>.<br>
        My goal is to become a <mark>skilled developer</mark>.
        <small>Always keep learning!</small>
    </p>

</body>
</html>
