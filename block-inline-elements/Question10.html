<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Location Selection</title>
</head>
<body>

    <h1>Select Your Travel Location</h1>

    <!-- Country dropdown -->
    <label for="country">Country:</label>

    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>France</option>
        <option>Japan</option>
    </select>

    <br><br>

    <!-- State dropdown -->
    <label for="state">State:</label>

    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Kerala</option>
    </select>

    <br><br>

    <!-- City dropdown -->
    <label for="city">City:</label>

    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
    </select>

    <br><br>

    <!-- Tourist place dropdown -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>Vrindavan</option>
        <option>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>Hawa Mahal</option>
    </select>

    <!-- Summary -->
    <p>
        My selected destination is Vrindavan in Mathura,
        Uttar Pradesh, India.
    </p>

</body>
</html>
