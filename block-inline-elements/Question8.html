<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>

    <h1>ABC Public School</h1>

    <h2>Student Academic Report</h2>

    <table border="1" title="Student Marks Report">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td title="English Language">English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td title="Mathematics">Mathematics</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td title="Science">Science</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td title="Social Science">Social Science</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td title="Computer Science">Computer Science</td>
            <td>100</td>
            <td>95</td>
        </tr>

        <!-- Total and percentage row -->
        <tr>
            <th colspan="2">Total and Percentage</th>
            <td>440 / 500 = 88%</td>
        </tr>

    </table>

</body>
</html>
