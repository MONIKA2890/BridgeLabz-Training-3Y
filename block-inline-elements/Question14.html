<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database</title>
</head>
<body>

    <h1>Movie Database</h1>

    <table border="1" title="Movie Database Table">

        <!-- Table caption -->
        <caption>
            <strong>Popular Movies</strong>
        </caption>

        <tr>
            <th>Movie Name</th>
            <th>Genre</th>
            <th>Year</th>
            <th>IMDB Rating</th>
            <th>Link</th>
        </tr>

        <tr>
            <td>3 Idiots</td>
            <td>Comedy/Drama</td>
            <td>2009</td>
            <td>8.4</td>
            <td>
                <a href="https://www.imdb.com/" target="_blank">
                    IMDb
                </a>
            </td>
        </tr>

        <tr>
            <td>Taare Zameen Par</td>
            <td>Drama</td>
            <td>2007</td>
            <td>8.3</td>
            <td>
                <a href="https://www.imdb.com/" target="_blank">
                    IMDb
                </a>
            </td>
        </tr>

        <tr>
            <td>12th Fail</td>
            <td>Drama</td>
            <td>2023</td>
            <td>8.8</td>
            <td>
                <a href="https://www.imdb.com/" target="_blank">
                    IMDb
                </a>
            </td>
        </tr>

        <!-- colspan example -->
        <tr>
            <td colspan="5">
                More movies will be added soon.
            </td>
        </tr>

    </table>

    <!-- Note -->
    <p>
        <small>
            Note: IMDb ratings are shown for educational purposes only.
        </small>
    </p>

</body>
</html>
