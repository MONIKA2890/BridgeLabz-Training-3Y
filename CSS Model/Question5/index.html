<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>

        <section>

            <h2>My Skills</h2>

            <!-- List for nth-child demonstration -->
            <ul class="skills">
                <li>HTML</li>
                <li>CSS</li>
                <li>Java</li>
                <li>Python</li>
                <li>SQL</li>
            </ul>

        </section>

        <section>

            <h2>Form</h2>

            <!-- Attribute selector demonstration -->
            <form>

                <label>Name:</label>

                <input type="text" placeholder="Enter your name">

                <br><br>

                <label>Email:</label>

                <input type="email" placeholder="Enter your email">

            </form>

        </section>

        <section>

            <h2>Useful Links</h2>

            <p class="description">
                Visit these websites:
            </p>

            <a href="https://www.google.com">Google</a>
            <br>
            <a href="https://www.github.com">GitHub</a>

        </section>

        <section class="combinators">

            <h2>Combinators</h2>

            <div>
                <p>First paragraph inside div.</p>

                <p>Second paragraph inside div.</p>

                <span>
                    <p>Nested paragraph inside span.</p>
                </span>
            </div>

            <p>Paragraph after div.</p>

        </section>

    </main>

    <footer>
        <p>Advanced CSS Selectors Practice</p>
    </footer>

</body>
</html>
