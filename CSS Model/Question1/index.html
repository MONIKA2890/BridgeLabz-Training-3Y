<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Borders & Padding Demonstration</h1>
        <p>Different border styles and padding values</p>
    </header>

    <main>

        <section class="boxes">

            <!-- Solid Border -->
            <div class="box solid">
                <h2>Solid Border</h2>
                <p>Padding: 20px</p>
            </div>

            <!-- Dashed Border -->
            <div class="box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 30px</p>
            </div>

            <!-- Double Border -->
            <div class="box double">
                <h2>Double Border</h2>
                <p>Padding: 15px</p>
            </div>

            <!-- Groove Border -->
            <div class="box groove">
                <h2>Groove Border</h2>
                <p>Padding: 25px</p>
            </div>

        </section>

        <section class="rounded-section">
            <h2>Rounded Corners</h2>

            <div class="rounded-box">
                This box uses border-radius.
            </div>
        </section>

    </main>

    <footer>
        <p>CSS Borders & Padding Practice</p>
    </footer>

</body>
</html>
