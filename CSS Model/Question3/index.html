<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fixed Header -->
    <header>
        <h1>CSS Gradient Webpage</h1>
    </header>

    <main>

        <!-- Linear Gradient Section -->
        <section class="linear-section">
            <h2>Linear Gradient</h2>

            <p>
                A linear gradient changes colors in a straight direction.
            </p>
        </section>

        <!-- Radial Gradient Section -->
        <section class="radial-section">
            <h2>Radial Gradient</h2>

            <p>
                A radial gradient starts from a central point and spreads
                outward in a circular or elliptical shape.
            </p>
        </section>

    </main>

    <!-- Fixed Footer -->
    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
