
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <!-- Page Header -->
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Different CSS filters applied to images</p>
    </header>

    <!-- Main Gallery Section -->
    <main>
        <section class="gallery">

            <figure class="gallery-item">
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain landscape">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="grayscale" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="sepia" src="https://picsum.photos/id/1035/500/350" alt="Mountain view">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="brightness" src="https://picsum.photos/id/1043/500/350" alt="Forest">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="contrast" src="https://picsum.photos/id/1069/500/350" alt="Nature">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="hue" src="https://picsum.photos/id/1074/500/350" alt="Beach">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>Responsive Image Gallery</p>
    </footer>

</body>
</html>
